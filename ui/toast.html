<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>拦截通知</title>
<style>
  :root {
    --bg: rgba(18, 21, 28, .97);
    --line: rgba(255, 255, 255, .1);
    --txt: #eef1f6;
    --dim: #98a2b5;
    --gold: #f5b544;
    --red: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: rgba(255, 255, 255, .98);
      --line: rgba(16, 20, 30, .1);
      --txt: #131821;
      --dim: #5d6675;
      --gold: #b57708;
      --red: #d33a3a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: transparent;
    font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden;
  }
  .card {
    height: calc(100% - 14px); margin: 7px;
    display: flex; gap: 13px; align-items: flex-start;
    padding: 15px 17px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 14px 40px -12px rgba(0, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .12);
    opacity: 0; transform: translateY(-10px) scale(.97);
    transition: opacity .22s ease, transform .26s cubic-bezier(.2, .9, .3, 1.1);
  }
  .card.in { opacity: 1; transform: none; }
  .ico {
    width: 38px; height: 38px; flex: none; border-radius: 12px;
    display: grid; place-items: center; font-size: 17px; font-weight: 700;
    background: linear-gradient(150deg, rgba(245, 181, 68, .22), rgba(245, 181, 68, .06));
    border: 1px solid rgba(245, 181, 68, .38);
    color: var(--gold);
  }
  .ico.site {
    background: linear-gradient(150deg, rgba(90, 160, 255, .2), rgba(90, 160, 255, .05));
    border-color: rgba(90, 160, 255, .4);
    color: #5aa0ff;
  }
  .body { flex: 1; min-width: 0; }
  .t { font-size: 13.5px; font-weight: 700; color: var(--txt); letter-spacing: .2px; }
  .s { font-size: 12px; color: var(--dim); margin-top: 5px; line-height: 1.55; word-break: break-all; }
  .s b { color: var(--txt); font-weight: 600; }
  .tag {
    display: inline-block; margin-top: 8px; padding: 2px 9px;
    font-size: 10.5px; border-radius: 999px;
    background: rgba(255, 107, 107, .14); color: var(--red);
    border: 1px solid rgba(255, 107, 107, .3);
  }
  .bar {
    position: absolute; left: 24px; right: 24px; bottom: 6px; height: 2px;
    border-radius: 2px; background: rgba(128, 128, 128, .18); overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--gold), rgba(245, 181, 68, .35));
    transform-origin: left center;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="ico" id="ico">王</div>
    <div class="body">
      <div class="t" id="title">已被拦截</div>
      <div class="s" id="sub">正在关闭…</div>
      <div class="tag" id="tag">自律模式 · 时间表内</div>
    </div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <script src="toast.js"></script>
</body>
</html>
