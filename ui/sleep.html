<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>睡眠时间</title>
<style>
  :root {
    --bg: #07080c;
    --fg: #eef2ff;
    --dim: #8b93a7;
    --gold: #ffc75f;
    --red: #ff5c5c;
    --line: rgba(255, 255, 255, .10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1100px 620px at 50% -12%, #17203a 0%, transparent 62%),
      radial-gradient(760px 460px at 82% 108%, #231a34 0%, transparent 60%),
      var(--bg);
    color: var(--fg);
    font: 15px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; cursor: default; overflow: hidden;
  }
  .wrap { width: min(760px, 84vw); text-align: center; }
  .moon { font-size: 40px; line-height: 1; opacity: .9; }
  .kicker {
    margin-top: 18px; letter-spacing: .34em; font-size: 12px;
    color: var(--dim); text-transform: uppercase;
  }
  h1 { margin: 8px 0 4px; font-size: 34px; font-weight: 650; letter-spacing: .02em; }
  .sub { color: var(--dim); font-size: 14.5px; }
  .clock {
    margin: 16px 0 0; font-size: 54px; font-weight: 300;
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }
  .count {
    display: inline-flex; align-items: baseline; gap: 10px;
    margin-top: 18px; padding: 14px 24px; border-radius: 16px;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .035);
  }
  .count .t {
    font-size: 38px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--gold); letter-spacing: .02em;
  }
  .count .l { color: var(--dim); font-size: 13.5px; }
  .count.hot .t { color: var(--red); }
  .bar {
    margin: 16px auto 0; width: 100%; height: 4px; border-radius: 999px;
    background: rgba(255, 255, 255, .08); overflow: hidden;
  }
  .bar i { display: block; height: 100%; width: 100%; background: var(--gold); transition: width .9s linear; }
  .row { margin-top: 22px; display: flex; gap: 12px; justify-content: center; align-items: center; }
  button {
    font: inherit; font-size: 14.5px; padding: 12px 22px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .05);
    color: var(--fg); cursor: pointer; transition: transform .16s, background .16s, border-color .16s;
  }
  button:hover:not(:disabled) { background: rgba(255, 255, 255, .10); border-color: rgba(255, 255, 255, .22); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.primary { background: linear-gradient(180deg, #ffd485, #f0a93b); color: #241a05; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .42; cursor: not-allowed; }
  .foot { margin-top: 18px; color: var(--dim); font-size: 12.5px; line-height: 1.9; }
  .foot b { color: #c9d2e6; font-weight: 600; }
  .err { margin-top: 14px; color: var(--red); font-size: 13px; min-height: 20px; }
  .tag {
    display: inline-block; margin-top: 14px; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); font-size: 12px;
  }
  .test { position: fixed; top: 14px; right: 18px; color: var(--gold); font-size: 12px; }
</style>
</head>
<body>
<div class="test" id="testTag" hidden></div>
<div class="wrap">
  <div class="moon">🌙</div>
  <div class="kicker" id="kicker">SLEEP HOURS</div>
  <h1 id="title">现在是睡眠时间</h1>
  <div class="sub" id="sub">这台电脑该关着了。</div>

  <div class="clock" id="clock">--:--:--</div>

  <div class="count" id="countBox">
    <span class="t" id="count">--:--</span>
    <span class="l" id="countLab">后自动关机</span>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div class="row">
    <button class="primary" id="unlock">用积分解锁</button>
  </div>
  <div class="err" id="err"></div>

  <div class="foot" id="foot"></div>
  <span class="tag" id="tag"></span>
</div>
<script src="sleep.js"></script>
</body>
</html>
