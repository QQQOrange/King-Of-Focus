<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>KOF UI harness</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="logo.png" alt="KOF" /></div>
      <div class="brand-text">
        <div class="brand-name">King of Focus</div>
        <div class="brand-sub">专注由你掌控</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="overview"><span class="ico">◎</span>总览</button>
      <button class="nav-item" data-view="clock"><span class="ico">◷</span>自律时段</button>
      <button class="nav-item" data-view="rules"><span class="ico">☰</span>自律规则</button>
      <button class="nav-item" data-view="mask"><span class="ico">▣</span>专注遮罩</button>

      <div class="topbar-right">

        <div class="pill" id="statePill">—</div>
        <div class="clock" id="clock">--:--</div>
      </div>
    </header>
    <div class="test-banner hidden" id="testBanner"></div>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
/* ---- 假 Tauri：只回放一份固定的 get_state，用来量布局 ---- */
/* 一周七天的自律计划：工作日 8–12 点，周六 9–11 点，周日全休 */
const ccDay = (from, to, work, brk) => Array.from({ length: 24 }, (_, h) => ({
  on: h >= from && h < to, work, brk,
}));
const STATE = {
  config: {
    version: 2,
    rules: [{
      id: 'seed-study', name: '自律时间', enabled: true, mode: 'blacklist',
      apps: [], sites: [{ id: 's1', pattern: 'www.douyin.com', label: 'www.douyin.com' }],
      exceptions: [], schedule: [[], [], [], [], [], [], []],
      lock: { kind: 'none', until: 0, password: '', chars: 20 },
      color: '#ff9f43', extraProtected: [], brk: { kind: 'none', workMin: 25, breakMin: 5 },
      hard: true,
    }],
    settings: {
      pollMs: 1000, dryRun: false, guardBrowser: true, graceSecs: 90,
      browserGuard: { enabled: true, notify: true, graceMs: 1200, detectOnStart: true },
      port: 27315, autostart: false, runAsAdmin: false, closeToTray: true, alwaysOnTop: false, softClose: true,
      siteCloseBrowser: true, blockTaskmgr: true, protected: [], theme: 'dark',
      mask: { opacity: 88, durationMs: 420, follow: true,
        blockClick: true, targetPid: 0, targetTitle: '', hotkey: 'Ctrl+Alt+K',
        hotkeyLabel: '', followSchedule: true, auto: false, autoApps: [] },
      focusClock: {
        enabled: true, applyRules: true, active: 'p1',
        profiles: [
          {
            id: 'p1', name: '工作日强化', defWork: 45, defBrk: 15,
            days: [ccDay(8, 12, 50, 10), ccDay(8, 12, 50, 10), ccDay(8, 12, 50, 10),
              ccDay(8, 12, 50, 10), ccDay(8, 12, 50, 10), ccDay(9, 11, 45, 15), ccDay(0, 0, 50, 10)],
          },
          {
            id: 'p2', name: '周末轻松', defWork: 25, defBrk: 5,
            days: [ccDay(0, 0, 25, 5), ccDay(0, 0, 25, 5), ccDay(0, 0, 25, 5),
              ccDay(0, 0, 25, 5), ccDay(0, 0, 25, 5), ccDay(10, 12, 25, 5), ccDay(15, 17, 25, 5)],
          },
        ],
      },
      stats: { enabled: true, countIdle: false, autoDaily: true, autoWeekly: true,
        autoMonthly: true, autoYearly: true, customDays: 0, customAnchor: '', retentionDays: 400 },
      sync: { enabled: false, url: '', username: '', password: '', auto: true, autoMinutes: 30,
        remoteFile: 'kof.json', device: 'PC', lastSync: 0, lastError: '', lastResult: '' },
      update: { enabled: true, repo: 'x/y', token: '', skippedVersion: '', lastCheck: 0 },
      hud: { enabled: true, quoteMinutes: 60, offsetX: 20, offsetY: 20 },
      customQuotes: ['先把手上的这一段做完。', '慢一点没关系，方向对就行。'],
      notify: { enabled: true, workBefore: 5, breakBefore: 2, breakNotify: true, focusWindow: false },
      backup: { password: '', autoOnStart: false },
    },
    updatedAt: 0,
    points: { balance: 12, totalEarned: 40, unlockUntil: 0, unlockCountToday: 0, day: '' },
  },
  runtime: { active: [], disciplineOn: true, blockedApps: 0, blockedSites: 0, nextChange: 3800,
    events: [], hb: 0, hbBrowser: '', locked: false, lockUntil: 0, lockUntilText: '', lockNames: [],
    breakOn: false, breakAny: false, breakLeft: 2280, notice: null, celebrate: null,
    clockInWindow: false, clockWeekday: 2, clockBreak: false, clockOn: false, clockHour: 9, clockLeft: 2280,
    clockSummary: '周一 – 周五 08:00–12:00；周六 09:00–11:00',
    quote: '你今天做的事，是你明天想成为的人。', quoteFrom: '关于自律' },
  mask: { on: true, userOn: false, autoOn: true, scheduleOn: true, painted: true, targetPid: 1, opacity: 88, duration: 420, blockClick: true,
    follow: true, hotkey: 'Ctrl+Alt+K', hotkeyOk: true,
    followSchedule: true, previewLeft: 0, notice: null, mediaPause: false },
  admin: true, testMode: false, dataDir: 'D:\\x', browsers: [
    { key: 'msedge', name: 'Microsoft Edge', installed: true, exe: 'C:\\Fake\\msedge.exe', exeSource: 'auto', ext: 'enabled', running: false, extPage: 'edge://extensions', dataDir: 'D:\\x', hits: [], note: '已启用' },
    { key: 'chrome', name: 'Google Chrome', installed: true, exe: '', exeSource: 'none', ext: 'notInstalled', running: false, extPage: 'chrome://extensions', dataDir: 'D:\\x', hits: [], note: '未找到主程序' },
  ], browserGuard: {},
  extFolder: 'D:\\software\\myself\\extension',
  extInfo: { path: 'D:\\software\\myself\\extension', exists: true,
    crx: 'D:\\software\\myself\\KingOfFocus-Extension.crx', exeDir: 'D:\\software\\myself',
    source: '程序同级 extension' },
  pid: 1, points: { balance: 12, earned: 40, unlockUntil: 0, count: 0, price: 15 },
  version: '0.1.0', buildDate: '2026-10-28', developer: 'QQQOrange',
  repoUrl: 'https://github.com/QQQOrange/King-Of-Focus', tokenDocUrl: '',
  appName: 'King of Focus', hasToken: false, configPath: 'D:\\x\\config.json',
  dataPath: 'D:\\x', now: '2026-10-27 09:00', weekday: '1',
};
window.__TAURI__ = {
  core: { invoke: async (cmd, args) => {
    if (cmd === 'get_state') return JSON.parse(JSON.stringify(STATE));
    // 让假后端真的"记住"配置，save_config → pull 闭环，便于交互回归
    if (cmd === 'save_config') { STATE.config = JSON.parse(JSON.stringify(args.config)); return null; }
    // 遮罩参数即时生效（对应后端 mask_set）
    if (cmd === 'mask_set') {
      if (args.opacity != null) STATE.mask.opacity = args.opacity;
      if (args.durationMs != null) STATE.mask.duration = args.durationMs;
      return null;
    }
    // 媒体管控开关：前端走 mask_media_pause 后立刻 pull，假后端要能给出新值
    if (cmd === 'mask_media_pause') {
      STATE.mask.mediaPause = !!args.enabled;
      if (STATE.config && STATE.config.settings && STATE.config.settings.mask) {
        STATE.config.settings.mask.mediaPause = !!args.enabled;
      }
      return null;
    }
    // 管理员开关：后端落盘 + 拉起提权副本（前端不自己 save）
    if (cmd === 'hud_set_look') {
      const h = STATE.config.settings.hud || (STATE.config.settings.hud = {});
      if (args.corner) h.corner = args.corner;
      if (args.opacity != null) h.opacity = args.opacity;
      if (args.offset_x != null) h.offsetX = args.offset_x;
      if (args.offset_y != null) h.offsetY = args.offset_y;
      return null;
    }
    if (cmd === 'set_always_on_top') { STATE.config.settings.alwaysOnTop = !!args.enabled; return null; }
    if (cmd === 'set_run_as_admin') {
      STATE.config.settings.runAsAdmin = !!args.enabled;
      return null;
    }
    if (cmd === 'browsers_scan') return {
      list: [
        { key: 'msedge', name: 'Microsoft Edge', installed: true, exe: 'C:\\Fake\\msedge.exe', exeSource: 'auto', ext: 'enabled', running: false, extPage: 'edge://extensions', dataDir: 'D:\\x', hits: [], note: '已启用' },
        { key: 'chrome', name: 'Google Chrome', installed: true, exe: '', exeSource: 'none', ext: 'notInstalled', running: false, extPage: 'chrome://extensions', dataDir: 'D:\\x', hits: [], note: '未找到主程序' },
      ],
      installed: 2, broken: 1,
    };
    // 浏览器自定义主程序路径：让"设置路径"链路可被前端回归验证
    if (cmd === 'pick_path') { window.__picked = (window.__picked || 0) + 1; return 'C:\\Picked\\chrome.exe'; }
    if (cmd === 'browser_set_path') { window.__setpath = (window.__setpath || 0) + 1; return '已保存：' + (args.path || '(清除)'); }
    if (cmd === 'browser_check_path') return args.path || '';
    if (cmd === 'browser_ext_info') return STATE.extInfo;
    if (cmd === 'mask_diag') return 'on=true painted=true 模式=区域挖洞';
    if (cmd === 'browser_open_ext') {
      window.__openExt = (window.__openExt || 0) + 1;
      window.__openExtKey = (args && args.key) || '';
      return '已打开 Microsoft Edge 的扩展管理页';
    }
    if (cmd === 'browser_open_folder') return '已打开扩展目录';
    if (cmd === 'update_quota') return { ok: false };
    if (cmd === 'force_quit') { window.__forceQuit = (window.__forceQuit || 0) + 1; return null; }
    if (cmd === 'report_list') return [];
    if (cmd === 'backup_list') return [];
    if (cmd === 'update_check') return { ok: true, newer: false, current: '0.0.2', latest: '0.0.2' };
    return null;
  } },
  event: { listen: async () => () => {} },
};

/* ---- 布局审计：把结果写进 DOM，供 --dump-dom 抓取 ---- */
window.__audit = async (view) => {
  const out = { view, w: innerWidth, overflow: [], overlap: [], cells: 0, issues: [] };
  const content = document.querySelector('#content');
  if (content.scrollWidth > content.clientWidth + 1) {
    out.overflow.push(`#content ${content.scrollWidth}>${content.clientWidth}`);
  }
  document.querySelectorAll('.card,.hrow,.tl,.cc,.mask-hero,.ext-box,.brow,.clock-state,.cc-legend,.cc-def').forEach((el) => {
    if (el.scrollWidth > el.clientWidth + 1 && el.clientWidth > 0) {
      out.overflow.push((el.className || el.tagName) + ` ${el.scrollWidth}>${el.clientWidth}`);
    }
  });
  // 自律时段柱状图：7 列 × 24 行
  const cells = [...document.querySelectorAll('.cc-cell')];
  out.cells = cells.length;
  out.days = document.querySelectorAll('.cc-dh').length;
  out.hours = document.querySelectorAll('.cc-hlab').length;
  const rs = cells.map((c) => c.getBoundingClientRect());
  for (let i = 0; i < rs.length; i++) {
    if (rs[i].width < 6) out.issues.push(`cell ${i} width=${rs[i].width.toFixed(1)}`);
    if (rs[i].height < 8) out.issues.push(`cell ${i} height=${rs[i].height.toFixed(1)}`);
  }
  // 同一行（top 相同）内，左右相邻格子不应互相覆盖
  const byRow = new Map();
  rs.forEach((r, i) => {
    const key = Math.round(r.top);
    if (!byRow.has(key)) byRow.set(key, []);
    byRow.get(key).push(i);
  });
  out.rows = byRow.size;
  byRow.forEach((idxs) => {
    idxs.sort((a, b) => rs[a].left - rs[b].left);
    for (let k = 1; k < idxs.length; k++) {
      if (rs[idxs[k]].left < rs[idxs[k - 1]].right - 0.6) out.overlap.push(`cell ${idxs[k - 1]}/${idxs[k]}`);
    }
  });
  // 网格几何：供截图像素级核对（网格位置 + 格子尺寸 + 每列 x）
  if (rs.length) {
    const g = document.querySelector('#ccGrid').getBoundingClientRect();
    out.grid = {
      x: +g.left.toFixed(1), y: +g.top.toFixed(1), w: +g.width.toFixed(1), h: +g.height.toFixed(1),
      cellW: +rs[0].width.toFixed(1), cellH: +rs[0].height.toFixed(1),
      first: [+rs[0].left.toFixed(1), +rs[0].top.toFixed(1)],
      cols: [...new Set(rs.map((r) => Math.round(r.left)))].sort((a, b) => a - b),
      rowTops: [...new Set(rs.map((r) => Math.round(r.top)))].sort((a, b) => a - b),
    };
  }
  // 通用：同层兄弟元素垂直方向不应互相覆盖
  document.querySelectorAll('.card').forEach((card, ci) => {
    const kids = [...card.children].filter((k) => k.offsetHeight > 0);
    for (let i = 1; i < kids.length; i++) {
      const a = kids[i - 1].getBoundingClientRect();
      const b = kids[i].getBoundingClientRect();
      if (b.top < a.bottom - 1.5) {
        out.overlap.push(`card${ci} ${kids[i - 1].className || kids[i - 1].tagName} over ${kids[i].className || kids[i].tagName}`);
      }
    }
  });
  const pre = document.createElement('pre');
  pre.id = 'audit';
  pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
  return out;
};

/* ---- 假后端：改运行态 / 重新拉一次 ---- */
window.__patch = async (patch) => {
  Object.assign(STATE.runtime, patch || {});
  if (patch && 'testMode' in patch) STATE.testMode = patch.testMode;
  // 管理员身份也允许在测试里切：用来验证"自律时段里不允许重启成管理员"
  if (patch && 'admin' in patch) STATE.admin = patch.admin;
  if (patch && 'runAsAdmin' in patch) STATE.config.settings.runAsAdmin = patch.runAsAdmin;
  await pull();
  render();
  return S.data;
};

/* ---- 交互回归：模拟拖选 / 单击 / 右键菜单，把断言结果写进 DOM ---- */
window.__itest = async () => {
  const out = [];
  const cell = (d, h) => document.querySelector(`.cc-cell[data-d="${d}"][data-h="${h}"]`);
  const fire = (type, el, opts = {}) =>
    el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, button: 0, ...opts }));
  const fc = () => S.data.config.settings.focusClock;
  /** 当前生效方案 */
  const prof = () => { const c = fc(); return c.profiles.find((p) => p.id === c.active) || c.profiles[0]; };
  /** 当前方案的排班表 */
  const pd = () => prof().days;
  const runs = (d) => [...document.querySelectorAll(`.cc-run[data-d="${d}"]`)];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  /** 打开"生效时间段"的完整页（大日历只在这一层里，微缩图那层没有格子） */
  const openFull = async () => { S.view = 'clock'; S.ccFull = true; render(); await wait(200); };
  await openFull();

  // 0a. 小时标签正序：从上到下 0 → 23；左上角是纵轴单位，不能又是一个 0
  const hlabs = [...document.querySelectorAll('.cc-hlab')].map((e) => e.textContent.trim());
  out.push(['小时标签正序 0→23', hlabs.join(','), Array.from({ length: 24 }, (_, i) => String(i)).join(',')]);
  out.push(['左上角标的是单位而不是 0', (document.querySelector('.cc-corner') || {}).textContent, '时']);
  out.push(['纵轴只有一个 0', hlabs.filter((t) => t === '0').length, 1]);
  // 正序下「当前小时」金框落在本地时间对应的格子（.now 用本地时间算）
  const nowW = (new Date().getDay() + 6) % 7, nowH = new Date().getHours();
  out.push(['当前小时高亮跟随本地时间', cell(nowW, nowH).classList.contains('now'), true]);
  // 正序实证：第一个小时标签（0）与 (周一,0) 格同一行
  const rH = document.querySelector('.cc-hlab').getBoundingClientRect();
  const rC = cell(0, 0).getBoundingClientRect();
  // 日历式时间轴：刻度文字按行顶对齐、再上移约 5px 让文字视觉居中于网格线，
  // 所以允许 ±8px 的偏移（这是设计，不是错位）。
  out.push(['0 点标签与 (周一,0) 同行', Math.abs(rH.top + 5 - rC.top) < 8, true]);

  // 0. 连续时段合并：周一 8–12 点必须是**一个**整块，高度正好盖住 4 格 + 3 道缝
  out.push(['周一 8–12 合并成一个块', runs(0).length, 1]);
  out.push(['合并块的起止小时', runs(0)[0] ? `${runs(0)[0].dataset.h0}-${runs(0)[0].dataset.h1}` : '(无)', '8-11']);
  const rc8 = cell(0, 8).getBoundingClientRect(), rc11 = cell(0, 11).getBoundingClientRect();
  const run0 = runs(0)[0] ? runs(0)[0].getBoundingClientRect() : null;

  // 0b. 滴答清单式周日历：行高、滚动、色块时长文字、实心色
  {
    const c8 = cell(0, 8);
    // 行高跟着粒度走：15 分钟粒度 = 4 格 × 13px = 52px/小时
    out.push(['每小时行高 52px（15 分钟粒度，4 格 × 13px）',
      Math.round(c8.getBoundingClientRect().height), 52]);
    out.push(['行高由 --cc-hour-h 统一控制',
      getComputedStyle(document.querySelector('#ccGrid')).gridTemplateRows.split(' ')[1], '52px']);
    const sc = document.querySelector('.cc-scroll');
    out.push(['日历限高可滚动（表头吸顶）',
      sc ? getComputedStyle(sc).overflowY + '/' + Math.round(sc.getBoundingClientRect().height) : '无',
      'auto/560']);
    const anyRun = document.querySelector('.cc-run');
    const txt = anyRun ? anyRun.querySelector('.cc-run-txt') : null;
    out.push(['色块上标了起止时间', txt ? /^[0-9][0-9]:[0-9][0-9] – [0-9][0-9]:[0-9][0-9]$/.test(txt.textContent.trim()) : false, true]);
    out.push(['色块时间不含非法的 :60', txt ? !/:60/.test(txt.textContent) : false, true]);
    const wBand = anyRun ? anyRun.querySelector('i.f') : null;
    out.push(['整块只用一种填充色（无渐变）',
      wBand ? getComputedStyle(wBand).backgroundImage === 'none' : false, true]);
    out.push(['填充色是不透明的纯色（无 alpha）',
      wBand ? /^rgb\(\d+, \d+, \d+\)$/.test(getComputedStyle(wBand).backgroundColor) : '', true]);
    // 块里不允许出现第二种颜色：旧版按 专注/休息/尾段 分三条不同颜色的带
    out.push(['块里没有别的色带（w/b/t 已移除）',
      anyRun ? anyRun.querySelectorAll('i.w, i.b, i.t').length : -1, 0]);
    out.push(['块内没有内描边 / 阴影',
      anyRun ? getComputedStyle(anyRun).boxShadow : '', 'none']);
    out.push(['块容器本身透明（颜色只来自填充带）',
      anyRun ? getComputedStyle(anyRun).backgroundColor : '', 'rgba(0, 0, 0, 0)']);
    out.push(['列间距 6px（每天一栏）',
      getComputedStyle(document.querySelector('#ccGrid')).columnGap, '6px']);
    out.push(['行间距 0（同一天连续不断开）',
      getComputedStyle(document.querySelector('#ccGrid')).rowGap, '0px']);
  }

  out.push(['整块高度 = 4 格 + 3 道缝', run0 ? Math.abs(run0.height - (rc11.bottom - rc8.top)) < 1.5 : false, true]);
  // 五天同一时段**不再**横跨合并：一天一块，各自圆角，靠 6px 列间距分开
  {
    const perDay = [0, 1, 2, 3, 4].map((d) => runs(d).length);
    out.push(['五天各自一块（不再横跨合并）', perDay.join(','), '1,1,1,1,1']);
    out.push(['周一那块只占一列', runs(0)[0] ? runs(0)[0].dataset.d1 : '(无)', '0']);
    const w0 = runs(0)[0] ? runs(0)[0].getBoundingClientRect().width : 0;
    const cw = cell(0, 8).getBoundingClientRect().width;
    out.push(['块宽 = 一列宽', Math.abs(w0 - cw) < 1.5, true]);
    // 相邻两天的块之间必须留缝，不能糊在一起
    const r0 = runs(0)[0].getBoundingClientRect();
    const r1 = runs(1)[0].getBoundingClientRect();
    out.push(['相邻两天的块之间有间隙', Math.round(r1.left - r0.right), 6]);
    // 每块的上/下两个外沿都必须是圆的（中间段本来就该是方角，那是同一块的内部）
    out.push(['每天的块上沿是圆角', [0, 1, 2, 3, 4].map((d) => {
      const f = runs(d)[0].querySelector('.f');
      return f ? getComputedStyle(f).borderTopLeftRadius : '无';
    }).join(','), '4px,4px,4px,4px,4px']);
    out.push(['每天的块下沿是圆角', [0, 1, 2, 3, 4].map((d) => {
      const all = runs(d)[0].querySelectorAll('.f');
      return all.length ? getComputedStyle(all[all.length - 1]).borderBottomLeftRadius : '无';
    }).join(','), '4px,4px,4px,4px,4px']);
  }
  // 周六只有 9–11 两格，也应是一个块；周日没选 → 一个块都没有

    cell(0, 8).dispatchEvent(cellEv);
    await wait(120);
    out.push(['时段格子的自有右键菜单仍照常', !!document.querySelector('.cc-modal'), true]);
    closeModal();
    ccCloseMenu();
    await wait(120);
  }


  // ---- 26f. Hub 顶部：激励语录（自定义 + 联网，来源要标明）----
  {
    S.quoteAt = '';
    await Act.nav('overview');
    await wait(280);
    const qc = document.querySelector('.hub-quote');
    const hero = document.querySelector('.hero');
    out.push(['Hub 顶部有语录区', !!qc]);
    out.push(['语录区在 hero 之前', !!(qc && hero)
      && (qc.compareDocumentPosition(hero) & Node.DOCUMENT_POSITION_FOLLOWING) !== 0, true]);
    out.push(['默认显示自己写的第一条',
      qc.querySelector('.qtext').textContent, '先把手上的这一段做完。']);
    out.push(['来源标为「我写的」', qc.querySelector('.qsrc').textContent, '我写的']);
    out.push(['有「换一条」按钮', !!qc.querySelector('[data-act="quote-next"]'), true]);
    out.push(['有「我的语录」入口', /我的语录/.test(qc.querySelector('[data-act="quote-manage"]').textContent), true]);
    out.push(['入口上显示条数', /· 2/.test(qc.querySelector('[data-act="quote-manage"]').textContent), true]);

    // 换一条 → 第二条自定义
    qc.querySelector('[data-act="quote-next"]').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    await wait(200);
    out.push(['换一条走到下一条自定义',
      document.querySelector('.hub-quote .qtext').textContent, '慢一点没关系，方向对就行。']);
    // 再换 → 联网那条，来源要变成「网络 · 一言」并带出处
    document.querySelector('[data-act="quote-next"]').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    await wait(200);
    out.push(['再换一条轮到联网语录',
      document.querySelector('.hub-quote .qtext').textContent, '你今天做的事，是你明天想成为的人。']);
    out.push(['联网语录标明来源', document.querySelector('.hub-quote .qsrc').textContent, '网络 · 一言']);
    out.push(['联网语录带出处',
      (document.querySelector('.hub-quote .qfrom') || {}).textContent, '—— 关于自律']);

    // 管理面板：添加一句 → 保存 → 回到 Hub 能看到
    document.querySelector('[data-act="quote-manage"]')
      .dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    await wait(200);
    out.push(['管理面板列出已有语录', document.querySelectorAll('.qrow').length, 2]);
    const inp = document.querySelector('#quoteNew');
    inp.value = '今天先赢一小局。';
    document.querySelector('[data-act="quote-add"]')
      .dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    await wait(150);
    out.push(['添加后列表变 3 条', document.querySelectorAll('.qrow').length, 3]);
    document.querySelector('[data-act="quote-save"]')
      .dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    await wait(400);
    out.push(['保存到配置', (STATE.config.settings.customQuotes || []).length, 3]);
    out.push(['保存后回到 Hub 且仍是语录',
      !!document.querySelector('.hub-quote'), true]);
    out.push(['入口条数跟着更新',
      /· 3/.test(document.querySelector('[data-act="quote-manage"]').textContent), true]);

    // 复位，别影响后面的用例
    STATE.config.settings.customQuotes = STATE.config.settings.customQuotes.slice(0, 2);
    S.quoteAt = '';
    render();
    await wait(150);
  }

  // ---- 26e. 外观选项（分段胶囊）：文字居中 + 选中态与胶囊同形 ----
  {
    await Act.nav('settings');
    await wait(260);
    const segs = [...document.querySelectorAll('.seg')];
    const seg = segs.find((x) => /跟随系统/.test(x.textContent || ''));
    out.push(['外观是分段胶囊', !!seg]);
    const btn = seg ? seg.querySelector('button.active') : null;
    const sb = seg.getBoundingClientRect();
    const bb = btn.getBoundingClientRect();
    out.push(['胶囊外轮廓是圆角', getComputedStyle(seg).borderRadius, '999px']);
    out.push(['选中指示与胶囊同半径', getComputedStyle(btn).borderRadius, '999px']);
    // 外层 padding 3 + 描边 1 → 四边各内缩 4px，指示块才和胶囊同形
    out.push(['选中指示上下各内缩 4px', Math.round(bb.top - sb.top), 4]);
    const allBtn = [...seg.querySelectorAll('button')];
    const first = allBtn[0].getBoundingClientRect();
    const last = allBtn[allBtn.length - 1].getBoundingClientRect();
    out.push(['首个选项左侧内缩 4px', Math.round(first.left - sb.left), 4]);
    out.push(['末个选项右侧内缩 4px', Math.round(sb.right - last.right), 4]);
    out.push(['选项高度 = 胶囊高 - 8', Math.round(bb.height), Math.round(sb.height) - 8]);
    out.push(['文字用 flex 垂直居中',
      getComputedStyle(btn).display + '/' + getComputedStyle(btn).alignItems, 'flex/center']);
    out.push(['文字水平居中', getComputedStyle(btn).justifyContent, 'center']);
    // 几何核对：按钮中线与胶囊中线对齐（±1px）
    out.push(['指示块与胶囊同心',
      Math.abs((bb.top + bb.height / 2) - (sb.top + sb.height / 2)) < 1, true]);
    // 三个选项等高
    const hs = [...seg.querySelectorAll('button')].map((b) => Math.round(b.getBoundingClientRect().height));
    out.push(['三个选项等高', new Set(hs).size, 1]);

    // 「自律时段内允许退出」：默认开（保持历史行为），关掉才禁退
    const qs = document.querySelector('.switch[data-k="allowQuitInSession"]');
    out.push(['设置里有「自律时段内允许退出」开关', !!qs, true]);
    out.push(['默认是开启的', qs ? qs.querySelector('input').checked : null, true]);
    out.push(['开关说明写清了"任何方式都退不掉"', (() => {
      const row = qs ? qs.closest('.row') : null;
      return row ? /任何方式/.test(row.textContent) : false;
    })(), true]);
  }

  // ---- 27. 专注计时弹窗（HUD）：四角可选 + 透明度可调 + 落盘 ----
  {
    STATE.config.settings.hud = STATE.config.settings.hud || {};
    STATE.config.settings.hud.corner = 'tr';
    STATE.config.settings.hud.opacity = 92;
    await Act.nav('settings');
    await wait(250);
    const corners = [...document.querySelectorAll('[data-act="hud-corner"]')];
    out.push(['HUD 位置有四个预设角', corners.length, 4]);
    out.push(['默认停靠右上（active）',
      (corners.find((c) => c.dataset.v === 'tr') || {}).className.includes('active'), true]);
    const br = corners.find((c) => c.dataset.v === 'br');
    br.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }));
    await wait(300);
    out.push(['点右下 → 写进配置', STATE.config.settings.hud.corner, 'br']);
    out.push(['点右下 → 按钮态跟着变',
      [...document.querySelectorAll('[data-act="hud-corner"]')].find((c) => c.dataset.v === 'br')
        .className.includes('active'), true]);
    const slider = document.querySelector('#hudOpacity');
    out.push(['有透明度滑块且范围 30–100', slider ? `${slider.min}-${slider.max}` : '无', '30-100']);
    slider.value = '60';
    slider.dispatchEvent(new Event('input', { bubbles: true }));
    await wait(80);
    out.push(['拖动时只更新读数、不写盘', STATE.config.settings.hud.opacity, 92]);
    out.push(['读数已变 60%', document.querySelector('#hudOpacityVal').textContent, '60%']);
    slider.dispatchEvent(new Event('change', { bubbles: true }));
    await wait(300);
    out.push(['松手后透明度写进配置', STATE.config.settings.hud.opacity, 60]);
    // 复位，避免影响后续（目前是最后一段）
    STATE.config.settings.hud.corner = 'tr';
    STATE.config.settings.hud.opacity = 92;
  }

  const pre = document.createElement('pre');
  pre.id = 'itest';
  pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
  return out;
};
</script>
<script src="app.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const view = q.get('view') || 'clock';
  // 等 boot 跑完 render
  await new Promise((r) => setTimeout(r, 700));
  if (window.Act && Act.nav) {
    try { await Act.nav(view); }
    catch (e) {
      const pre = document.createElement('pre');
      pre.id = 'boot-err';
      pre.textContent = String((e && (e.stack || e.message)) || e);
      document.body.appendChild(pre);
    }
  }
  await new Promise((r) => setTimeout(r, 500));
  // 无头截图与 dump-dom 的滚动基准拉齐，便于像素级核对
  window.scrollTo(0, 0);
  // 截图辅助：?openmenu=d,h 打开某一格的右键菜单后停住
  const om = q.get('openmenu');
  if (om) {
    const [d, h] = om.split(',').map(Number);
    const c = document.querySelector(`.cc-cell[data-d="${d}"][data-h="${h}"]`);
    if (c) c.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 500, clientY: 500 }));
    const m = document.querySelector('.cc-modal');
    if (m) {
      const r = m.getBoundingClientRect();
      const btn = document.querySelector('#ccApply');
      const br = btn ? btn.getBoundingClientRect() : null;
      const cs = btn ? getComputedStyle(btn).backgroundImage : '';
      const pre = document.createElement('pre');
      pre.id = 'menugeo';
      pre.textContent = JSON.stringify({
        menu: [r.left, r.top, r.width, r.height],
        btn: br ? [br.left, br.top, br.width, br.height] : null,
        btnBg: cs.slice(0, 80),
        innerHeight: window.innerHeight, innerWidth: window.innerWidth,
      });
      document.body.appendChild(pre);
    }
    return;
  }
  if (q.get('itest')) {
    try { await window.__itest(); }
    catch (e) {
      const pre = document.createElement('pre');
      pre.id = 'itest-err';
      pre.textContent = String((e && (e.stack || e.message)) || e);
      document.body.appendChild(pre);
    }
    return;
  }
  await window.__audit(view);
})();
</script>
</body>
