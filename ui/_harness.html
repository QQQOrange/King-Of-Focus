<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>KOF UI harness</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="logo.png" alt="KOF" /></div>
      <div class="brand-text">
        <div class="brand-name">King of Focus</div>
        <div class="brand-sub">专注由你掌控</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="overview"><span class="ico">◎</span>总览</button>
      <button class="nav-item" data-view="rules"><span class="ico">☰</span>规则</button>
      <button class="nav-item" data-view="clock"><span class="ico">◷</span>自律时段</button>
      <button class="nav-item" data-view="mask"><span class="ico">▣</span>专注遮罩</button>
      <button class="nav-item" data-view="browsers"><span class="ico">▤</span>浏览器插件</button>
      <button class="nav-item" data-view="settings"><span class="ico">⚙</span>设置</button>
    </nav>
    <div class="side-foot">
      <div id="sideStatus" class="side-status"></div>
      <div class="side-version" id="sideVersion">v1.0.0</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">总览</div>
      <div class="topbar-right">
        <button class="btn btn-sm" data-act="cycle-theme" id="themeBtn" title="切换外观">◐ 跟随系统</button>
        <div class="pill" id="statePill">—</div>
        <div class="clock" id="clock">--:--</div>
      </div>
    </header>
    <div class="test-banner hidden" id="testBanner"></div>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
/* ---- 假 Tauri：只回放一份固定的 get_state，用来量布局 ---- */
/* 一周七天的自律计划：工作日 8–12 点，周六 9–11 点，周日全休 */
const ccDay = (from, to, work, brk) => Array.from({ length: 24 }, (_, h) => ({
  on: h >= from && h < to, work, brk,
}));
const STATE = {
  config: {
    version: 2,
    lists: [{
      id: 'seed-study', name: '自律时间', enabled: true, mode: 'blacklist',
      apps: [], sites: [{ id: 's1', pattern: 'www.douyin.com', label: 'www.douyin.com' }],
      exceptions: [], schedule: [[], [], [], [], [], [], []],
      lock: { kind: 'none', until: 0, password: '', chars: 20 },
      color: '#ff9f43', extraProtected: [], brk: { kind: 'none', workMin: 25, breakMin: 5 },
      hard: true,
    }],
    settings: {
      pollMs: 1000, dryRun: false, guardBrowser: true, graceSecs: 90,
      browserGuard: { enabled: true, notify: true, graceMs: 1200, detectOnStart: true },
      port: 27315, autostart: false, runAsAdmin: false, closeToTray: true, softClose: true,
      siteCloseBrowser: true, blockTaskmgr: true, protected: [], theme: 'dark',
      mask: { opacity: 88, durationMs: 420, follow: true,
        blockClick: true, targetPid: 0, targetTitle: '', hotkey: 'Ctrl+Alt+K',
        hotkeyLabel: '', followSchedule: true, auto: false, autoApps: [] },
      focusClock: {
        enabled: true, applyRules: true, active: 'p1',
        profiles: [
          {
            id: 'p1', name: '工作日强化', defWork: 45, defBrk: 15,
            days: [ccDay(8, 12, 50, 10), ccDay(8, 12, 50, 10), ccDay(8, 12, 50, 10),
              ccDay(8, 12, 50, 10), ccDay(8, 12, 50, 10), ccDay(9, 11, 45, 15), ccDay(0, 0, 50, 10)],
          },
          {
            id: 'p2', name: '周末轻松', defWork: 25, defBrk: 5,
            days: [ccDay(0, 0, 25, 5), ccDay(0, 0, 25, 5), ccDay(0, 0, 25, 5),
              ccDay(0, 0, 25, 5), ccDay(0, 0, 25, 5), ccDay(10, 12, 25, 5), ccDay(15, 17, 25, 5)],
          },
        ],
      },
      stats: { enabled: true, countIdle: false, autoDaily: true, autoWeekly: true,
        autoMonthly: true, autoYearly: true, customDays: 0, customAnchor: '', retentionDays: 400 },
      sync: { enabled: false, url: '', username: '', password: '', auto: true, autoMinutes: 30,
        remoteFile: 'kof.json', device: 'PC', lastSync: 0, lastError: '', lastResult: '' },
      update: { enabled: true, repo: 'x/y', token: '', skippedVersion: '', lastCheck: 0 },
      hud: { enabled: true, quoteMinutes: 60, offsetX: 20, offsetY: 20 },
      notify: { enabled: true, workBefore: 5, breakBefore: 2, breakNotify: true, focusWindow: false },
      backup: { password: '', autoOnStart: false },
    },
    updatedAt: 0,
    points: { balance: 12, totalEarned: 40, unlockUntil: 0, unlockCountToday: 0, day: '' },
  },
  runtime: { active: [], disciplineOn: true, blockedApps: 0, blockedSites: 0, nextChange: 3800,
    events: [], hb: 0, hbBrowser: '', locked: false, lockUntil: 0, lockUntilText: '', lockNames: [],
    breakOn: false, breakAny: false, breakLeft: 2280, notice: null, celebrate: null,
    clockInWindow: false, clockWeekday: 2, clockBreak: false, clockOn: false, clockHour: 9, clockLeft: 2280,
    clockSummary: '周一 – 周五 08:00–12:00；周六 09:00–11:00' },
  mask: { on: true, userOn: false, autoOn: true, scheduleOn: true, painted: true, targetPid: 1, opacity: 88, duration: 420, blockClick: true,
    follow: true, hotkey: 'Ctrl+Alt+K', hotkeyOk: true,
    followSchedule: true, previewLeft: 0, notice: null, mediaPause: false },
  admin: true, testMode: false, dataDir: 'D:\\x', browsers: [
    { key: 'msedge', name: 'Microsoft Edge', installed: true, exe: 'C:\\Fake\\msedge.exe', exeSource: 'auto', ext: 'enabled', running: false, extPage: 'edge://extensions', dataDir: 'D:\\x', hits: [], note: '已启用' },
    { key: 'chrome', name: 'Google Chrome', installed: true, exe: '', exeSource: 'none', ext: 'notInstalled', running: false, extPage: 'chrome://extensions', dataDir: 'D:\\x', hits: [], note: '未找到主程序' },
  ], browserGuard: {},
  extFolder: 'D:\\software\\myself\\extension',
  extInfo: { path: 'D:\\software\\myself\\extension', exists: true,
    crx: 'D:\\software\\myself\\KingOfFocus-Extension.crx', exeDir: 'D:\\software\\myself',
    source: '程序同级 extension' },
  pid: 1, points: { balance: 12, earned: 40, unlockUntil: 0, count: 0, price: 15 },
  version: '0.0.2', buildDate: '2026-10-27', developer: 'QQQOrange',
  repoUrl: 'https://github.com/QQQOrange/King-Of-Focus', tokenDocUrl: '',
  appName: 'King of Focus', hasToken: false, configPath: 'D:\\x\\config.json',
  dataPath: 'D:\\x', now: '2026-10-27 09:00', weekday: '1',
};
window.__TAURI__ = {
  core: { invoke: async (cmd, args) => {
    if (cmd === 'get_state') return JSON.parse(JSON.stringify(STATE));
    // 让假后端真的"记住"配置，save_config → pull 闭环，便于交互回归
    if (cmd === 'save_config') { STATE.config = JSON.parse(JSON.stringify(args.config)); return null; }
    // 遮罩参数即时生效（对应后端 mask_set）
    if (cmd === 'mask_set') {
      if (args.opacity != null) STATE.mask.opacity = args.opacity;
      if (args.durationMs != null) STATE.mask.duration = args.durationMs;
      return null;
    }
    // 媒体管控开关：前端走 mask_media_pause 后立刻 pull，假后端要能给出新值
    if (cmd === 'mask_media_pause') {
      STATE.mask.mediaPause = !!args.enabled;
      if (STATE.config && STATE.config.settings && STATE.config.settings.mask) {
        STATE.config.settings.mask.mediaPause = !!args.enabled;
      }
      return null;
    }
    // 管理员开关：后端落盘 + 拉起提权副本（前端不自己 save）
    if (cmd === 'set_run_as_admin') {
      STATE.config.settings.runAsAdmin = !!args.enabled;
      return null;
    }
    if (cmd === 'browsers_scan') return {
      list: [
        { key: 'msedge', name: 'Microsoft Edge', installed: true, exe: 'C:\\Fake\\msedge.exe', exeSource: 'auto', ext: 'enabled', running: false, extPage: 'edge://extensions', dataDir: 'D:\\x', hits: [], note: '已启用' },
        { key: 'chrome', name: 'Google Chrome', installed: true, exe: '', exeSource: 'none', ext: 'notInstalled', running: false, extPage: 'chrome://extensions', dataDir: 'D:\\x', hits: [], note: '未找到主程序' },
      ],
      installed: 2, broken: 1,
    };
    // 浏览器自定义主程序路径：让"设置路径"链路可被前端回归验证
    if (cmd === 'pick_path') { window.__picked = (window.__picked || 0) + 1; return 'C:\\Picked\\chrome.exe'; }
    if (cmd === 'browser_set_path') { window.__setpath = (window.__setpath || 0) + 1; return '已保存：' + (args.path || '(清除)'); }
    if (cmd === 'browser_check_path') return args.path || '';
    if (cmd === 'browser_ext_info') return STATE.extInfo;
    if (cmd === 'mask_diag') return 'on=true painted=true 模式=区域挖洞';
    if (cmd === 'browser_open_ext') {
      window.__openExt = (window.__openExt || 0) + 1;
      window.__openExtKey = (args && args.key) || '';
      return '已打开 Microsoft Edge 的扩展管理页';
    }
    if (cmd === 'browser_open_folder') return '已打开扩展目录';
    if (cmd === 'update_quota') return { ok: false };
    if (cmd === 'report_list') return [];
    if (cmd === 'backup_list') return [];
    if (cmd === 'update_check') return { ok: true, newer: false, current: '0.0.2', latest: '0.0.2' };
    return null;
  } },
  event: { listen: async () => () => {} },
};

/* ---- 布局审计：把结果写进 DOM，供 --dump-dom 抓取 ---- */
window.__audit = async (view) => {
  const out = { view, w: innerWidth, overflow: [], overlap: [], cells: 0, issues: [] };
  const content = document.querySelector('#content');
  if (content.scrollWidth > content.clientWidth + 1) {
    out.overflow.push(`#content ${content.scrollWidth}>${content.clientWidth}`);
  }
  document.querySelectorAll('.card,.hrow,.tl,.cc,.mask-hero,.ext-box,.brow,.clock-state,.cc-legend,.cc-def').forEach((el) => {
    if (el.scrollWidth > el.clientWidth + 1 && el.clientWidth > 0) {
      out.overflow.push((el.className || el.tagName) + ` ${el.scrollWidth}>${el.clientWidth}`);
    }
  });
  // 自律时段柱状图：7 列 × 24 行
  const cells = [...document.querySelectorAll('.cc-cell')];
  out.cells = cells.length;
  out.days = document.querySelectorAll('.cc-dh').length;
  out.hours = document.querySelectorAll('.cc-hlab').length;
  const rs = cells.map((c) => c.getBoundingClientRect());
  for (let i = 0; i < rs.length; i++) {
    if (rs[i].width < 6) out.issues.push(`cell ${i} width=${rs[i].width.toFixed(1)}`);
    if (rs[i].height < 8) out.issues.push(`cell ${i} height=${rs[i].height.toFixed(1)}`);
  }
  // 同一行（top 相同）内，左右相邻格子不应互相覆盖
  const byRow = new Map();
  rs.forEach((r, i) => {
    const key = Math.round(r.top);
    if (!byRow.has(key)) byRow.set(key, []);
    byRow.get(key).push(i);
  });
  out.rows = byRow.size;
  byRow.forEach((idxs) => {
    idxs.sort((a, b) => rs[a].left - rs[b].left);
    for (let k = 1; k < idxs.length; k++) {
      if (rs[idxs[k]].left < rs[idxs[k - 1]].right - 0.6) out.overlap.push(`cell ${idxs[k - 1]}/${idxs[k]}`);
    }
  });
  // 网格几何：供截图像素级核对（网格位置 + 格子尺寸 + 每列 x）
  if (rs.length) {
    const g = document.querySelector('#ccGrid').getBoundingClientRect();
    out.grid = {
      x: +g.left.toFixed(1), y: +g.top.toFixed(1), w: +g.width.toFixed(1), h: +g.height.toFixed(1),
      cellW: +rs[0].width.toFixed(1), cellH: +rs[0].height.toFixed(1),
      first: [+rs[0].left.toFixed(1), +rs[0].top.toFixed(1)],
      cols: [...new Set(rs.map((r) => Math.round(r.left)))].sort((a, b) => a - b),
      rowTops: [...new Set(rs.map((r) => Math.round(r.top)))].sort((a, b) => a - b),
    };
  }
  // 通用：同层兄弟元素垂直方向不应互相覆盖
  document.querySelectorAll('.card').forEach((card, ci) => {
    const kids = [...card.children].filter((k) => k.offsetHeight > 0);
    for (let i = 1; i < kids.length; i++) {
      const a = kids[i - 1].getBoundingClientRect();
      const b = kids[i].getBoundingClientRect();
      if (b.top < a.bottom - 1.5) {
        out.overlap.push(`card${ci} ${kids[i - 1].className || kids[i - 1].tagName} over ${kids[i].className || kids[i].tagName}`);
      }
    }
  });
  const pre = document.createElement('pre');
  pre.id = 'audit';
  pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
  return out;
};

/* ---- 假后端：改运行态 / 重新拉一次 ---- */
window.__patch = async (patch) => {
  Object.assign(STATE.runtime, patch || {});
  if (patch && 'testMode' in patch) STATE.testMode = patch.testMode;
  // 管理员身份也允许在测试里切：用来验证"自律时段里不允许重启成管理员"
  if (patch && 'admin' in patch) STATE.admin = patch.admin;
  if (patch && 'runAsAdmin' in patch) STATE.config.settings.runAsAdmin = patch.runAsAdmin;
  await pull();
  render();
  return S.data;
};

/* ---- 交互回归：模拟拖选 / 单击 / 右键菜单，把断言结果写进 DOM ---- */
window.__itest = async () => {
  const out = [];
  const cell = (d, h) => document.querySelector(`.cc-cell[data-d="${d}"][data-h="${h}"]`);
  const fire = (type, el, opts = {}) =>
    el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, button: 0, ...opts }));
  const fc = () => S.data.config.settings.focusClock;
  /** 当前生效方案 */
  const prof = () => { const c = fc(); return c.profiles.find((p) => p.id === c.active) || c.profiles[0]; };
  /** 当前方案的排班表 */
  const pd = () => prof().days;
  const runs = (d) => [...document.querySelectorAll(`.cc-run[data-d="${d}"]`)];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // 0a. 小时标签正序：从上到下 0 → 23；左上角是纵轴单位，不能又是一个 0
  const hlabs = [...document.querySelectorAll('.cc-hlab')].map((e) => e.textContent.trim());
  out.push(['小时标签正序 0→23', hlabs.join(','), Array.from({ length: 24 }, (_, i) => String(i)).join(',')]);
  out.push(['左上角标的是单位而不是 0', (document.querySelector('.cc-corner') || {}).textContent, '时']);
  out.push(['纵轴只有一个 0', hlabs.filter((t) => t === '0').length, 1]);
  // 正序下「当前小时」金框落在本地时间对应的格子（.now 用本地时间算）
  const nowW = (new Date().getDay() + 6) % 7, nowH = new Date().getHours();
  out.push(['当前小时高亮跟随本地时间', cell(nowW, nowH).classList.contains('now'), true]);
  // 正序实证：第一个小时标签（0）与 (周一,0) 格同一行
  const rH = document.querySelector('.cc-hlab').getBoundingClientRect();
  const rC = cell(0, 0).getBoundingClientRect();
  out.push(['0 点标签与 (周一,0) 同行', Math.abs(rH.top - rC.top) < 2, true]);

  // 0. 连续时段合并：周一 8–12 点必须是**一个**整块，高度正好盖住 4 格 + 3 道缝
  out.push(['周一 8–12 合并成一个块', runs(0).length, 1]);
  out.push(['合并块的起止小时', runs(0)[0] ? `${runs(0)[0].dataset.h0}-${runs(0)[0].dataset.h1}` : '(无)', '8-11']);
  const rc8 = cell(0, 8).getBoundingClientRect(), rc11 = cell(0, 11).getBoundingClientRect();
  const run0 = runs(0)[0] ? runs(0)[0].getBoundingClientRect() : null;
  out.push(['整块高度 = 4 格 + 3 道缝', run0 ? Math.abs(run0.height - (rc11.bottom - rc8.top)) < 1.5 : false, true]);
  // 周一–周五同一时段合并成一条横跨 5 列的整带（d0→d4，单块）。
  // 宽度 ≥ 周五右沿-周一左沿（右侧若与相邻日接壤会再补最多 3px 缝，故不取等）
  out.push(['周一–周五 同一时段合并成一条整带', run0
    ? (runs(0).length === 1 && runs(0)[0].dataset.d1 === '4'
      && run0.width - (cell(4, 8).getBoundingClientRect().right - rc8.left) >= -1.5)
    : false, true]);
  // 周六只有 9–11 两格，也应是一个块；周日没选 → 一个块都没有
  out.push(['周六 9–11 一个块', runs(5).length, 1]);
  out.push(['周六块覆盖 2 格', runs(5)[0] ? Math.abs(runs(5)[0].getBoundingClientRect().height - (cell(5, 10).getBoundingClientRect().bottom - cell(5, 9).getBoundingClientRect().top)) < 1.5 : false, true]);
  out.push(['没选中的一天没有块', runs(6).length, 0]);
  // 选中格本身不再自带底色，视觉全部来自整块
  out.push(['选中格底色交给整块（::before 已移除）', getComputedStyle(cell(0, 9), '::before').content, 'none']);

  // 0c. 多方案：两条方案 chip，当前生效的那条高亮
  out.push(['方案 chip 数量', document.querySelectorAll('.cc-prof').length, 2]);
  out.push(['当前方案是工作日强化', (document.querySelector('.cc-prof.active .nm') || {}).textContent, '工作日强化']);
  out.push(['方案 chip 显示段数', [...document.querySelectorAll('.cc-prof .n')].map((e) => e.textContent).join('|'), '22 段|4 段']);

  // 1. 二维拖选：周三 13 点 → 周五 15 点（3 天 × 3 小时 = 9 段，原本全关）
  fire('mousedown', cell(2, 13));
  fire('mouseover', cell(2, 14));
  fire('mouseover', cell(4, 15));
  const liveDuringDrag = $('#clockLive').textContent;
  fire('mouseup', document);
  await wait(250);
  out.push(['拖选 9 段全开', pd().slice(2, 5).every((day) => [13, 14, 15].every((h) => day[h].on))]);
  out.push(['拖选不碰区外', !pd()[1][13].on && !pd()[5][13].on && !pd()[2][12].on && !pd()[2][16].on]);
  out.push(['区外原有保留', pd()[0][8].on === true]);
  out.push(['新选时段沿用通用时长 45/15', (() => { const p = pd()[3][14]; return p.work === 45 && p.brk === 15; })()]);
  out.push(['原有选中保留自定义值', pd()[0][8].work === 50 && pd()[0][8].brk === 10]);
  // 拖选出来的 3×3 也必须是每列一个整块（周三/周四/周五各一块）
  const dragRun = [...document.querySelectorAll('.cc-run')].find((r) => r.dataset.h0 === '13' && r.dataset.h1 === '15');
  out.push(['拖选 3 天 × 3 小时 = 一整块', dragRun ? `${dragRun.dataset.d}-${dragRun.dataset.d1}` : '(无)', '2-4']);
  out.push(['拖动中实时文案', liveDuringDrag, '周三 – 周五 13:00 – 15:15']);
  // 旧断言用整点文案，新交互把结束刻度从「小时尾」收窄到「刻度尾」——拖选语义落到 15 分钟刻度上
  // out.push(['拖动中实时文案', liveDuringDrag, '周三 – 周五 13:00 – 16:00']);

  // 1a. 15 分钟细分刻度：每格 4 条、默认隐藏、拖选/hover 才显示；单击刻度 = 单独开关那 15 分钟
  const fireQ = (type, el, q, opts = {}) =>
    el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, button: 0, clientY: q, ...opts }));
  const qCount = cell(2, 13).querySelectorAll('.cc-q').length;
  out.push(['每格 4 条 15 分钟刻度', qCount, 4]);
  out.push(['15 分钟刻度有 0/15/30/45 标记', [...cell(2, 13).querySelectorAll('.cc-q')].map((e) => e.dataset.a).join(','), '0,15,30,45']);
  const q0 = cell(2, 13).querySelector('.cc-q');
  out.push(['默认刻度不可见（opacity=0）', q0 ? getComputedStyle(q0).opacity : '', '0']);
  cell(2, 13).classList.add('qshow');
  void cell(2, 13).offsetHeight; // 强制样式重算
  out.push(['拖选/hover 时刻度浮现', q0 ? getComputedStyle(q0).opacity : '', '1']);
  cell(2, 13).classList.remove('qshow');
  // 单击刻度 = 挖掉那 15 分钟（周三 13:00–15:15 里挖掉 14:00–14:15 → 13:00–14:00 与 14:15–15:15）
  fireQ('mousedown', cell(2, 14), 0); // 刻度 0 = 14:00–14:15
  fireQ('mouseup', document, 0);
  await wait(250);
  const p214 = pd()[2][14];
  out.push(['单击刻度挖掉 15 分钟', (() => { const p = pd()[2][14]; return p.on && p.from === 15 && p.to === 60; })() || (p214.on && p214.from === 15 && p214.to === 60)]);
  out.push(['挖掉后相邻小时不受影响', pd()[2][13].on === true && pd()[2][15].on === true]);
  out.push(['挖掉后周三仍有两条区间', $('#clockLive').textContent.indexOf('13:00') >= 0 && $('#clockLive').textContent.indexOf('14:15') >= 0]);
  // 再点一次刻度补回去（选中 = 并上窗口）
  fireQ('mousedown', cell(2, 14), 0);
  fireQ('mouseup', document, 0);
  await wait(250);
  out.push(['单击刻度再补回 15 分钟', (() => { const p = pd()[2][14]; return p.on && p.from === 0 && p.to === 60; })()]);

  // 1b. 框选后右键落在选区内 → 目标默认取整个矩形（核心流程）。

    adminSw2.click();
    await wait(300);
    out.push(['自律时段生效中：打开管理员被拒绝', S.data.config.settings.runAsAdmin, false]);
  }
  // 时段外恢复可用
  await window.__patch({ clockOn: false, admin: false });
  await Act.nav('settings');
  await wait(250);
  const te2 = document.querySelector('[data-act="test-enter"]');
  out.push(['时段外：进入测试模式按钮可用', !!te2 && te2.disabled === false]);
  const adminSw3 = document.querySelector('[data-act="cfg-switch"][data-k="runAsAdmin"]');
  out.push(['时段外：管理员开关不置灰', !!adminSw3 && !adminSw3.classList.contains('locked')]);
  await window.__patch({ admin: true, runAsAdmin: true });

  // 16. 专注遮罩页：「跟随当前窗口」只保留唯一一个开关（曾出现两处重复渲染）
  await Act.nav('mask');
  await wait(200);
  const followSw = document.querySelectorAll('[data-act="toggle-follow"]');
  out.push(['遮罩页跟随当前窗口开关唯一', followSw.length, 1]);
  // 该开关的"标题"（文本恰为「跟随当前窗口」且不含子元素的 div）只应出现一次
  const followTitles = [...document.querySelectorAll('div')].filter((n) => n.children.length === 0 && n.textContent.trim() === '跟随当前窗口');
  out.push(['跟随当前窗口标题唯一', followTitles.length, 1]);

  // 16b. 媒体管控开关：遮罩页必须有唯一开关，点击走 mask_media_pause 并落库
  const mediaSw = document.querySelectorAll('[data-act="toggle-media-pause"]');
  out.push(['遮罩页媒体管控开关唯一', mediaSw.length, 1]);
  const mediaBefore = S.data.mask.mediaPause;
  if (mediaSw[0]) {
    mediaSw[0].click();
    await wait(250);
    out.push(['媒体管控开关可切换并保存', S.data.mask.mediaPause === !mediaBefore]);
    out.push(['媒体管控同步进配置', S.data.config.settings.mask.mediaPause === !mediaBefore]);
    document.querySelector('[data-act="toggle-media-pause"]').click();
    await wait(250);
    out.push(['媒体管控再点一次恢复', S.data.mask.mediaPause === mediaBefore]);
  }

  // 17. 浏览器插件页：「设置路径」存在，且点击后走后端 pick_path 原生选取（而非前端 T.dialog / prompt）
  await Act.nav('browsers');
  await wait(250);
  const pathBtn = document.querySelector('[data-act="browser-setpath"]');
  out.push(['浏览器页有设置路径按钮', !!pathBtn]);
  window.__picked = 0; window.__setpath = 0;
  if (pathBtn) {
    pathBtn.click();
    await wait(300);
  }
  // 真正的证据：mock 的 pick_path 被调用（后端原生选取通道），随后 browser_set_path 落盘
  out.push(['设置路径走后端原生选取', window.__picked >= 1, true]);
  out.push(['设置路径已落盘保存', window.__setpath >= 1, true]);

  // 18. 「扩展页」按钮：点击后必须走后端 browser_open_ext 并带上浏览器 key
  window.__openExt = 0; window.__openExtKey = '';
  const extBtn = document.querySelector('[data-act="browser-page"]');
  out.push(['浏览器页有扩展页按钮', !!extBtn]);
  if (extBtn) {
    extBtn.click();
    await wait(300);
    out.push(['扩展页按钮走 browser_open_ext', window.__openExt >= 1, true]);
    out.push(['扩展页调用带上浏览器 key', window.__openExtKey, extBtn.dataset.k || '']);
  }

  // 19. 快捷键卡片：只留快捷键控件，不再有浅蓝背景框（.note）的遮罩介绍
  await Act.nav('mask');
  await wait(250);
  const hkCard = [...document.querySelectorAll('.card')].find((c) => (c.querySelector('.card-title') || {}).textContent === '快捷键');
  out.push(['快捷键卡片存在', !!hkCard]);
  if (hkCard) {
    out.push(['快捷键卡片无浅蓝介绍框', hkCard.querySelectorAll('.note').length, 0]);
    out.push(['快捷键输入框保留', !!hkCard.querySelector('#hkInput')]);
  }

  const pre = document.createElement('pre');
  pre.id = 'itest';
  pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
  return out;
};
</script>
<script src="app.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const view = q.get('view') || 'clock';
  // 等 boot 跑完 render
  await new Promise((r) => setTimeout(r, 700));
  if (window.Act && Act.nav) {
    try { await Act.nav(view); }
    catch (e) {
      const pre = document.createElement('pre');
      pre.id = 'boot-err';
      pre.textContent = String((e && (e.stack || e.message)) || e);
      document.body.appendChild(pre);
    }
  }
  await new Promise((r) => setTimeout(r, 500));
  // 无头截图与 dump-dom 的滚动基准拉齐，便于像素级核对
  window.scrollTo(0, 0);
  // 截图辅助：?openmenu=d,h 打开某一格的右键菜单后停住
  const om = q.get('openmenu');
  if (om) {
    const [d, h] = om.split(',').map(Number);
    const c = document.querySelector(`.cc-cell[data-d="${d}"][data-h="${h}"]`);
    if (c) c.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 500, clientY: 500 }));
    const m = document.querySelector('.cc-menu');
    if (m) {
      const r = m.getBoundingClientRect();
      const btn = document.querySelector('#ccApply');
      const br = btn ? btn.getBoundingClientRect() : null;
      const cs = btn ? getComputedStyle(btn).backgroundImage : '';
      const pre = document.createElement('pre');
      pre.id = 'menugeo';
      pre.textContent = JSON.stringify({
        menu: [r.left, r.top, r.width, r.height],
        btn: br ? [br.left, br.top, br.width, br.height] : null,
        btnBg: cs.slice(0, 80),
        innerHeight: window.innerHeight, innerWidth: window.innerWidth,
      });
      document.body.appendChild(pre);
    }
    return;
  }
  if (q.get('itest')) {
    try { await window.__itest(); }
    catch (e) {
      const pre = document.createElement('pre');
      pre.id = 'itest-err';
      pre.textContent = String((e && (e.stack || e.message)) || e);
      document.body.appendChild(pre);
    }
    return;
  }
  await window.__audit(view);
})();
</script>
