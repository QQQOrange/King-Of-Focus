<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  body {
    margin: 0; width: 268px; padding: 14px 16px 16px;
    background: #0c0f15; color: #e8ecf4;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; font-size: 12.5px;
  }
  .hd { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .mark {
    width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    background: #1c2230; border: 1px solid #2f384b; color: #4d8dff; font-weight: 700; font-size: 13px;
  }
  .ttl { font-weight: 600; font-size: 13px; }
  .st { font-size: 11px; color: #6b7488; margin-top: 1px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; display: inline-block; margin-right: 5px; }
  .dot.ok { background: #35d07f; box-shadow: 0 0 7px #35d07f; }
  .dot.bad { background: #ff5c5c; }
  .box { background: #12161f; border: 1px solid #1e2532; border-radius: 9px; padding: 9px 11px; margin-bottom: 9px; }
  .r { display: flex; justify-content: space-between; padding: 3px 0; color: #8b95a8; }
  .r b { color: #dfe5f0; font-weight: 600; }
  ul { margin: 6px 0 0; padding-left: 16px; color: #9aa4b8; line-height: 1.7; }
  button {
    width: 100%; padding: 7px; border-radius: 8px; cursor: pointer; font-size: 12px;
    background: #1a2030; color: #dfe5f0; border: 1px solid #2e3a52;
  }
  button:hover { background: #223049; }
</style>
</head>
<body>
  <div class="hd">
    <div class="mark">王</div>
    <div>
      <div class="ttl">King Of Focus</div>
      <div class="st"><span class="dot" id="dot"></span><span id="stText" data-i18n="status.checking">检测中…</span></div>
    </div>
  </div>
  <div class="box">
    <div class="r"><span data-i18n="port">主程序端口</span><b id="port">—</b></div>
    <div class="r"><span data-i18n="mode">当前模式</span><b id="mode">—</b></div>
    <div class="r"><span data-i18n="left">本段还剩</span><b id="left">—</b></div>
    <div class="r"><span data-i18n="rules">生效规则</span><b id="cnt">0</b></div>
    <div class="r"><span data-i18n="sweep">收尾方式</span><b id="sweep">—</b></div>
    <div class="r"><span data-i18n="swept">上次收尾</span><b id="swept">—</b></div>
  </div>
  <ul id="list"></ul>
  <div style="margin-top:10px"><button id="refresh" data-i18n="btn.refresh">立即刷新规则</button></div>
  <div style="margin-top:7px"><button id="sweepNow" data-i18n="btn.sweepWeb">现在收尾</button></div>

  <div class="box" style="margin-top:9px">
    <div class="r"><span data-i18n="upd.channel">更新通道</span><b id="updPlat">—</b></div>
    <div class="r"><span data-i18n="upd.version">当前版本</span><b id="updVer">—</b></div>
    <div class="r"><span data-i18n="upd.auto">自动检查更新</span><b><input type="checkbox" id="updAuto" /></b></div>
  </div>
  <div id="updMsg" style="font-size:11.5px;color:#8b95a8;line-height:1.65;margin-bottom:7px"></div>
  <button id="updCheck" data-i18n="upd.check">检查更新</button>
  <div style="margin-top:7px;display:none" id="updGetWrap">
    <button id="updGet" data-i18n="upd.get">下载新版本</button>
  </div>

  <script src="i18n.js"></script>
  <script src="update.js"></script>
  <script src="popup.js"></script>
</body>
</html>
