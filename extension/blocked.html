<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>已被 King of Focus 拦截</title>
<link rel="stylesheet" href="blocked.css" />
</head>
<body>
<div class="wrap">
  <div class="mark">王</div>
  <h1 id="title" data-i18n="blocked.title">这个页面现在不能看</h1>
  <p class="sub" id="sub" data-i18n="blocked.sub">你正在自律模式的生效时段内。</p>
  <div class="box">
    <div class="row"><span data-i18n="blocked.rule">命中规则</span><b id="ruleName">—</b></div>
    <div class="row"><span data-i18n="blocked.url">目标地址</span><b id="url" class="url">—</b></div>
    <div class="row" id="whiteRow" hidden><span data-i18n="blocked.mode">当前模式</span><b data-i18n="blocked.mode.white">白名单 · 只允许名单里的网站</b></div>
  </div>
  <div class="tip">
    <span data-i18n="blocked.tip1">想改名单？在主程序里打开「规则 → 网站」。</span><br />
    <span data-i18n="blocked.tip2">如果这不是你想要的，说明时间表需要调整。</span>
  </div>
  <div class="foot" data-i18n="blocked.foot">King of Focus · 专注由你掌控</div>
</div>
<script src="i18n.js"></script>
<script src="blocked.js"></script>
</body>
</html>
